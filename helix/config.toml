theme = "zed_onedark_transparent"

[editor.indent-guides]
render = true
character = "╎"
skip-indent-level = 1 # 最初のインデント（レベル0）を表示しない場合は設定

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[keys.normal]
space = { p = "paste_clipboard_after", y = "yank_main_selection_to_clipboard" }
